name: Passages
options:
  bundleIdPrefix: com.mak.passages
  # iOS 12.0 is the floor the hardware forces (iPad mini 2, A7, iOS 12.5.8).
  # This rules out SwiftUI (13.0), scene lifecycle (13.0), and the whole
  # semantic-colour API. Everything here is UIKit + PDFKit, deliberately.
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
  # Current XcodeGen writes a pbxproj that Xcode 15.4 cannot parse -- it fails
  # with a bare "Unable to read project", which looks like a corrupt file
  # rather than a version mismatch. Pinning the object version keeps the
  # generated project readable by the pinned toolchain.
  #
  # These two pins move together: the Xcode version in CI is fixed because the
  # app targets iOS 12, so the project format has to be fixed to match.
  objectVersion: 54
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # CI builds unsigned and packages the .ipa by hand; AltStore re-signs
    # on the Windows side with the free Apple ID.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  Passages:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The asset catalogue has to be listed explicitly. It was added with the
      # icon on 17 Aug and silently did nothing for a build, because `sources`
      # only had Sources/ -- so the icons were generated, committed, and never
      # compiled in. Info.plist living under Resources/ is not the same thing
      # as Resources/ being a source.
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Passages
        # Names the icon set inside Assets.xcassets. Without this the catalogue
        # compiles but nothing points at it, which looks identical to a build
        # with no icon at all.
        XSAppIconAssets: Assets.xcassets/AppIcon.appiconset
        # Bump BOTH on every build that gets sideloaded. The library screen
        # shows them, and that footer is the only way to tell two sideloaded
        # builds apart -- there is no App Store version to check against.
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        UILaunchStoryboardName: ""
        # All four, because iPad multitasking requires either the full set or
        # UIRequiresFullScreen -- and a reader that refuses an orientation
        # because the iPad was picked up the other way round is its own bug.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Voice notes are recorded on device and transcribed later on the
        # ThinkPad -- Moonshine cannot run on an A7 with 1 GB of RAM.
        NSMicrophoneUsageDescription: >-
          Record spoken annotations while reading. Audio stays on the device
          until it syncs to your own laptop.
        # The app's Documents directory holds the papers, the annotations JSON
        # and the voice/ recordings. Exposing it costs nothing -- this is a
        # sideloaded app on the owner's own device -- and buys a way to get at
        # the audio from the Files app when sync is the thing that is broken.
        # Its absence is why thirteen recordings were not merely un-uploaded
        # but *unreachable*: on disk, intact, and invisible from the device.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The reader talks to a laptop over Tailscale, which is plain HTTP on a
        # private tailnet -- no public traffic, so ATS is relaxed for those
        # hosts only rather than globally.
        #
        # Both are listed. The reader moved from the ThinkPad to the always-on
        # IdeaPad, and leaving the old host here means pointing `baseURL` back
        # at the desk stays a one-line change rather than a rebuild-and-resign.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            100.77.134.90:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            100.117.163.83:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
